[package]
name = "docpack"
version = "0.1.0"
edition = "2024"
authors = ["orioninsist"]
description = "Markdown document packager for AI projects"
license = "MIT"
readme = "README.md"
keywords = ["markdown", "documentation", "ai", "tokenizer"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tiktoken-rs = "0.12.1"
walkdir = "2.5.0"
